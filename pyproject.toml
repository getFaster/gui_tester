[project]
name = "gui-tester"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tensorboard>=2.20.0",
    "tqdm>=4.66.5",
    "transformers>=5.14.1",
    "triton-windows>=3.7.1.post27",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
